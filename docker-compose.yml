services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    working_dir: /app
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgresql://brm:brm_dev_password@postgres:5432/business_review_monitor
      REDIS_URL: redis://redis:6379
      BRM_QUEUE_PREFIX: brm
      JWT_ACCESS_SECRET: replace-with-at-least-32-characters
      JWT_REFRESH_SECRET: replace-with-at-least-32-characters
      TOKEN_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      GOOGLE_CLIENT_ID: replace-with-google-client-id
      GOOGLE_CLIENT_SECRET: replace-with-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3333/integrations/google/callback
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:3333
      GOOGLE_PROVIDER: mock
      META_APP_ID: mock-app-id
      META_APP_SECRET: mock-app-secret
      META_INSTAGRAM_REDIRECT_URI: http://localhost:3333/integrations/instagram/callback
      META_WEBHOOK_VERIFY_TOKEN: mock-webhook-token
    ports:
      - "${API_PORT:-3333}:3333"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/apps/api/node_modules
      - /app/node_modules
      - pnpm-store:/app/.pnpm-store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333
    working_dir: /app/apps/web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3333
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_WEBPACK_POLLING: "1000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/node_modules
      - pnpm-store:/app/.pnpm-store
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    command: ["sh", "-c", "pnpm install && pnpm --filter @brm/config build && pnpm --filter @brm/shared build && pnpm --filter @brm/ui build && pnpm --filter @brm/web dev"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: development
    working_dir: /app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://brm:brm_dev_password@postgres:5432/business_review_monitor
      REDIS_URL: redis://redis:6379
      BRM_QUEUE_PREFIX: brm
      JWT_ACCESS_SECRET: replace-with-at-least-32-characters
      JWT_REFRESH_SECRET: replace-with-at-least-32-characters
      TOKEN_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      GOOGLE_CLIENT_ID: replace-with-google-client-id
      GOOGLE_CLIENT_SECRET: replace-with-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3333/integrations/google/callback
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:3333
      GOOGLE_PROVIDER: mock
      META_APP_ID: mock-app-id
      META_APP_SECRET: mock-app-secret
      META_INSTAGRAM_REDIRECT_URI: http://localhost:3333/integrations/instagram/callback
      META_WEBHOOK_VERIFY_TOKEN: mock-webhook-token
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - /app/apps/worker/node_modules
      - /app/node_modules
      - pnpm-store:/app/.pnpm-store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brm
      POSTGRES_PASSWORD: brm_dev_password
      POSTGRES_DB: business_review_monitor
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brm -d business_review_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  pnpm-store: